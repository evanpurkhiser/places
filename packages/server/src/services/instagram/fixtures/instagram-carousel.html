                                    "text": "Tiffany and Rick Johnson were evicted from their home after their landlord accused them of committing a crime. The Johnsons’ landlord was able to move forward with the eviction based on the accusation alone because of a document included in most Arizona lease agreements: the Crime Free Lease Addendum.\n \nThat document allows landlords to initiate an eviction action against tenants without a conviction, criminal charge or even a crime. Though Arizona law already allows a landlord to start an eviction against a tenant for criminal activity, the addendum gives property managers more leeway to determine what constitutes a crime.\n\nRead more at the link in our bio. 🔗\n \nWritten by: Hannah Dreyfus ✍️ | Photos by: Megan Mendoza/The Republic, Provided by the Johnson family; provided by Southern Arizona Legal Aid, Courtesy of Timothy Zehring, Provided by Mesa Police Department 📷\n \n#housing #crime #evictions #family #phoenix #arizona",
